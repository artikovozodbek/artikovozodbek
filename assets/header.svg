<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Ozodbek Artikbayev — AI/ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#071d2a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3ff"/>
      <stop offset="0.55" stop-color="#3be0c3"/>
      <stop offset="1" stop-color="#a48bff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2aabee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2aabee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="340" rx="22"/></clipPath>
    <style>
      .name{font:800 64px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:-1.5px}
      .sub{font:500 22px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#b9c6e6}
      .mono{font:600 19px 'JetBrains Mono','Cascadia Code',Consolas,monospace;fill:#7fe9ff}
      .chip{font:600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#dfe7ff}
      .r{opacity:0;animation:cycle 12s infinite}
      .r1{animation-delay:0s}.r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}
      @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .float{animation:float 9s ease-in-out infinite}
      .float2{animation:float 12s ease-in-out infinite reverse}
      @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-14px)}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{0%{transform:translateX(-300px)}100%{transform:translateX(1500px)}}
      .dot{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .in{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
      .in2{animation-delay:.25s}.in3{animation-delay:.5s}.in4{animation-delay:.75s}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="float" cx="960" cy="70" r="260" fill="url(#glowA)"/>
    <circle class="float2" cx="1110" cy="300" r="220" fill="url(#glowB)"/>
    <rect class="scan" x="0" y="0" width="160" height="340" fill="#ffffff" opacity="0.025" transform="skewX(-18)"/>

    <!-- network motif -->
    <g opacity="0.9" stroke="#3be0c3" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M860 120 L960 80 L1060 130 L1000 210 L900 200 Z"/>
      <path d="M960 80 L1000 210 M860 120 L1000 210 M1060 130 L1130 90 M1060 130 L1120 220 M900 200 L880 270 M1000 210 L1040 280"/>
    </g>
    <g fill="#7fe9ff">
      <circle class="dot" cx="860" cy="120" r="5"/>
      <circle class="dot" cx="960" cy="80" r="6" style="animation-delay:.4s"/>
      <circle class="dot" cx="1060" cy="130" r="5" style="animation-delay:.8s"/>
      <circle class="dot" cx="1000" cy="210" r="7" style="animation-delay:1.2s"/>
      <circle class="dot" cx="900" cy="200" r="4" style="animation-delay:1.6s"/>
      <circle class="dot" cx="1130" cy="90" r="4" style="animation-delay:2s"/>
      <circle class="dot" cx="1120" cy="220" r="4" style="animation-delay:.6s"/>
      <circle class="dot" cx="880" cy="270" r="3" style="animation-delay:1s"/>
      <circle class="dot" cx="1040" cy="280" r="3" style="animation-delay:1.4s"/>
    </g>

    <text class="mono in" x="64" y="84">~/artikovozodbek $ whoami</text>
    <text class="name in in2" x="62" y="160" fill="url(#txt)">Ozodbek Artikbayev</text>
    <text class="sub in in3" x="64" y="200">AI / ML Engineer · Tashkent, Uzbekistan</text>

    <g class="in in4">
      <text class="mono" x="64" y="250">&gt;</text>
      <g transform="translate(88 0)">
        <text class="mono r r1" x="0" y="250">building RAG systems that cite their sources</text>
        <text class="mono r r2" x="0" y="250">shipping AI agents that act, not just chat</text>
        <text class="mono r r3" x="0" y="250">profiling: 57 s → 14 s per task, chat in ~2 s</text>
        <text class="mono r r4" x="0" y="250">evaluating models honestly, not assuming</text>
      </g>
    </g>

    <g transform="translate(64 284)">
      <rect width="96" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text class="chip" x="48" y="21" text-anchor="middle">RAG</text>
      <rect x="108" width="132" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text class="chip" x="174" y="21" text-anchor="middle">Agentic AI</text>
      <rect x="252" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text class="chip" x="327" y="21" text-anchor="middle">Classical ML</text>
      <rect x="414" width="170" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text class="chip" x="499" y="21" text-anchor="middle">Computer Vision</text>
      <rect x="596" width="200" height="32" rx="16" fill="#3be0c3" fill-opacity="0.16" stroke="#3be0c3" stroke-opacity="0.6"/>
      <circle class="dot" cx="616" cy="16" r="5" fill="#3be0c3"/>
      <text class="chip" x="708" y="21" text-anchor="middle" fill="#bff7ec">Open to internships</text>
    </g>
  </g>
</svg>
